<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 210" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D4FF" />
      <stop offset="100%" stop-color="#58A6FF" />
    </linearGradient>
  </defs>

  <style>
    .font-mono {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Liberation Mono", Menlo, Courier, monospace;
    }
    .cursor {
      animation: blink 1s infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
  </style>

  <!-- Terminal Window Background -->
  <rect x="1" y="1" width="798" height="208" rx="10" fill="url(#bg)" stroke="#30363d" stroke-width="1.5" />

  <!-- Window Header Bar -->
  <path d="M 1 11 A 10 10 0 0 1 11 1 L 789 1 A 10 10 0 0 1 799 11 L 799 36 L 1 36 Z" fill="#161b22" />
  <line x1="1" y1="36" x2="799" y2="36" stroke="#30363d" stroke-width="1" />

  <!-- Window Control Buttons -->
  <circle cx="20" cy="18.5" r="5.5" fill="#ff5f56" />
  <circle cx="38" cy="18.5" r="5.5" fill="#ffbd2e" />
  <circle cx="56" cy="18.5" r="5.5" fill="#27c93f" />

  <!-- Window Title -->
  <text x="400" y="22.5" fill="#8b949e" font-size="12" text-anchor="middle" class="font-mono">andres@cachyos:~</text>

  <!-- Terminal Body Content -->
  <!-- Line 1: Command -->
  <text x="32" y="74" fill="#58a6ff" font-size="15" font-weight="600" class="font-mono">❯</text>
  <text x="48" y="74" fill="#7ee787" font-size="15" font-weight="600" class="font-mono">whoami</text>

  <!-- Name -->
  <text x="32" y="116" fill="#ffffff" font-size="28" font-weight="700" class="font-mono">Andrés Camilo Martínez</text>

  <!-- Subtitle -->
  <text x="32" y="148" fill="url(#accent)" font-size="16" font-weight="600" class="font-mono">Fullstack Developer · TypeScript · Next.js · Linux</text>

  <!-- Line 2: Status / Prompt -->
  <text x="32" y="184" fill="#8b949e" font-size="14" class="font-mono">building scalable web apps &amp; clean architectures</text>
  <rect x="425" y="171" width="8" height="15" fill="#00D4FF" class="cursor" />
</svg>
